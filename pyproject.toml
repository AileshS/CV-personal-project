[project]
name = "basketball-play-lab"
version = "0.1.0"
description = "A reviewable basketball possession and shot-analysis training lab"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3", "pillow>=11,<13", "opencv-python>=4.10,<5",
  "streamlit>=1.57,<2", "pandas>=2.2,<4", "scikit-learn>=1.6,<2",
  "imageio-ffmpeg>=0.6,<0.7", "yt-dlp>=2026.1", "joblib>=1.4,<2",
]

[project.optional-dependencies]
vision = ["ultralytics>=8.3,<9", "torch>=2.6,<3", "torchvision>=0.21,<1", "lap>=0.5.12,<0.6"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
playlab = "playlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["playlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

